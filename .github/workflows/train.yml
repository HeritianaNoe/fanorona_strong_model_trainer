name: Train Fanorona Model

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Training iterations'
        required: true
        default: '5'
      games:
        description: 'Self-play games per iteration'
        required: true
        default: '20'
      simulations:
        description: 'MCTS simulations per move'
        required: true
        default: '200'
      epochs:
        description: 'Neural-network epochs'
        required: true
        default: '2'

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Train
        run: |
          python train_fanorona.py \
            --iterations ${{ inputs.iterations }} \
            --games-per-iteration ${{ inputs.games }} \
            --simulations ${{ inputs.simulations }} \
            --epochs ${{ inputs.epochs }} \
            --out checkpoints
      - name: Export TFLite
        run: python convert_tflite.py --checkpoint checkpoints/latest.keras --output fanorona_model.tflite
      - name: Validate TFLite
        run: python scripts/validate_tflite.py fanorona_model.tflite
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanorona-model
          path: fanorona_model.tflite
